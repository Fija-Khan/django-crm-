{% extends "base.html" %}


{% block title %}
Delete Note
{% endblock %}



{% block content %}


<div class="container-fluid mt-4">


    <div class="crm-card text-center">


        <!-- ================= ICON ================= -->

        <div class="crm-empty-state py-3">

            <i class="bi bi-trash3 text-danger"
               style="font-size:42px;">
            </i>

        </div>



        <!-- ================= TITLE ================= -->

        <h3 class="crm-title mb-3">

            Delete Note

        </h3>



        <!-- ================= MESSAGE ================= -->

        <p class="crm-page-subtitle mb-4">

            Are you sure you want to delete this note?

        </p>



        <!-- ================= NOTE PREVIEW ================= -->

        <div class="crm-detail-box mb-4 mx-auto"
             style="max-width:650px;">

            <p class="mb-0">

                <strong class="text-white">
                    Note:
                </strong>

                <span class="text-secondary">
                    {{ object.content|truncatechars:100 }}
                </span>

            </p>

        </div>



        <!-- ================= ACTIONS ================= -->

        <form method="post">

            {% csrf_token %}


            <button type="submit"
                    class="crm-btn-danger">

                <i class="bi bi-trash"></i>

                Yes, Delete

            </button>



            <a href="{% url 'notes:note_list' %}"
               class="crm-btn-secondary ms-2">

                <i class="bi bi-arrow-left"></i>

                Cancel

            </a>


        </form>


    </div>


</div>


{% endblock %}
