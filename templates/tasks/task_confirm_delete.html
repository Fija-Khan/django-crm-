{% extends "base.html" %}

{% block title %}
Delete Task
{% endblock %}

{% block content %}

<div class="container-fluid crm-delete-page">

    <div class="row justify-content-center">

        <div class="col-lg-6 col-md-8">

            <!-- DELETE CARD -->

            <div class="crm-delete-card">

                <!-- ICON -->

                <div class="crm-delete-icon">

                    <i class="bi bi-trash3"></i>

                </div>


                <!-- TITLE -->

                <h2 class="crm-delete-title">
                    Delete Task?
                </h2>


                <p class="crm-delete-subtitle">
                    Are you sure you want to delete this task?
                </p>


                <!-- TASK NAME -->

                <div class="crm-delete-task">

                    <span class="crm-delete-label">
                        TASK
                    </span>

                    <h4>
                        {{ task.title }}
                    </h4>

                </div>


                <!-- WARNING -->

                <div class="crm-delete-warning">

                    <i class="bi bi-exclamation-triangle"></i>

                    <span>
                        This action cannot be undone.
                    </span>

                </div>


                <!-- ACTIONS -->

                <form method="post" class="crm-delete-actions">

                    {% csrf_token %}

                    <a
                        href="{% url 'tasks:task_detail' task.pk %}"
                        class="crm-btn-secondary"
                    >

                        <i class="bi bi-arrow-left"></i>

                        Cancel

                    </a>


                    <button
                        type="submit"
                        class="crm-btn-danger"
                    >

                        <i class="bi bi-trash3"></i>

                        Delete Task

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
