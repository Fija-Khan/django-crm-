{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow p-4">

                <h3 class="mb-4 text-center">
                    Change Password 🔐
                </h3>


                <form method="POST">

                    {% csrf_token %}


                    {% if form.errors %}
                        <div class="alert alert-danger">
                            Please correct the errors below.
                        </div>
                    {% endif %}


                    <div class="mb-3">

                        <label class="form-label">
                            Old Password
                        </label>

                        {{ form.old_password }}

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            New Password
                        </label>

                        {{ form.new_password1 }}

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Confirm New Password
                        </label>

                        {{ form.new_password2 }}

                    </div>


                    <button type="submit" class="btn btn-primary w-100">
                        Change Password
                    </button>


                </form>


            </div>

        </div>

    </div>

</div>


{% endblock %}
